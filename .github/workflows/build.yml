name: build

on:
  push:
    branches: [master, main, dev]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AntennaLab.slnx

      - name: Build
        run: dotnet build AntennaLab.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tests/AntennaLib.Tests/AntennaLib.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
